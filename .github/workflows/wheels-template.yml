name: Template for building NEURON Python wheels

on:
  workflow_call:
    inputs:
      platform:
        description: The platform (OS) for which to build the wheel
        required: true
        type: string
      python_version:
        description: The Python version used to build the wheel (3.11 versioned, 3.12 abi3)
        required: true
        type: string
      test_python_versions:
        description: Comma-separated GIL Python versions to test the abi3 wheel with (3.11 is always tested only on 3.11)
        required: false
        default: '3.12,3.13,3.14'
        type: string
      commit:
        description: The commit of NEURON for which to build the wheel
        required: true
        type: string
      version:
        description: Override version (tag name), in format major.minor.patch
        default: ''
        type: string
      build_type:
        description: The type of build (release or nightly)
        default: 'nightly'
        type: string
      clone_depth:
        description: The depth to clone the repo
        default: '1'
        type: string
      optimize_rxd:
        description: Whether to optimize the RX3D Python module
        default: false
        type: boolean

jobs:
  build-test:
    name: Build and test Python ${{ inputs.python_version }} wheel on ${{ inputs.platform }}
    runs-on: ${{ inputs.platform }}
    timeout-minutes: 60
    steps:
      - name: Check out code at branch/commit ${{ inputs.commit }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          submodules: recursive
          fetch-depth: ${{ inputs.clone_depth }}
          fetch-tags: true  # Ensures tags are available for git describe

      - name: Setup host Python for cibuildwheel (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # MSVC win_amd64 wheel: ninja, winflexbison, MS-MPI. Not MSYS2/MinGW setup.exe.
      # IV gitlink ac31164 (neuronsimulator/iv hines-grok/msvc-windows).
      - name: Install MSVC wheel dependencies
        if: runner.os == 'Windows'
        run: .\ci\win_msvc_wheel_deps.cmd
        shell: cmd

      - name: Install Python from python.org
        if: runner.os == 'macOS'
        run: |
          # I would've preferred the versions to be in their own YAML file for
          # readability, but alas, GitHub Actions does not support expanding
          # nested expressions, so we do this the brute-force way with Bash
          case "${{ inputs.python_version }}" in
            3.11) version="3.11.7" ;;
            3.12) version="3.12.0" ;;
            3.13) version="3.13.0" ;;
            3.14) version="3.14.0" ;;
            *) echo "Unknown Python version"; exit 1 ;;
          esac

          installer_name="macos11.pkg"
          installer_filename="python-${version}-${installer_name}"
          url="https://www.python.org/ftp/python/${version}/${installer_filename}"
          curl $url -o $installer_filename
          sudo installer -pkg $installer_filename -target /

      - name: Install system dependencies
        if: runner.os == 'macOS'
        run: |
          brew install --cask xquartz
          brew uninstall cmake || echo "CMake was not pre-installed"
          brew install flex bison cmake mpich ninja
          brew unlink mpich && brew install openmpi
          # Install newer version of Bash on MacOS
          brew install bash
          # For debugging
          bash --version
          cmake --version

          # Handle libomp: ensure it's installed (no longer pre-installed on recent macos-15 runners)
          if ! brew list --versions libomp >/dev/null 2>&1; then
            echo "libomp not found --> installing"
            brew install libomp
          else
            echo "libomp already installed"
          fi
          brew link --force libomp || true

          # Export paths so later build steps (cibuildwheel, compilers) can find libomp
          LIBOMP_PREFIX=$(brew --prefix libomp)
          echo "LDFLAGS=-L${LIBOMP_PREFIX}/lib ${LDFLAGS:-}" >> $GITHUB_ENV
          echo "CPPFLAGS=-I${LIBOMP_PREFIX}/include ${CPPFLAGS:-}" >> $GITHUB_ENV
          echo "DYLD_LIBRARY_PATH=${LIBOMP_PREFIX}/lib:${DYLD_LIBRARY_PATH:-}" >> $GITHUB_ENV

          # Force Homebrew bison/flex/cmake to the FRONT of PATH (keg-only, so required)
          BREW_PREFIX=$(brew --prefix)
          export PATH="${BREW_PREFIX}/opt/bison/bin:${BREW_PREFIX}/opt/flex/bin:${BREW_PREFIX}/opt/cmake/bin:$PATH"
          echo "${BREW_PREFIX}/opt/bison/bin:${BREW_PREFIX}/opt/flex/bin:${BREW_PREFIX}/opt/cmake/bin" >> $GITHUB_PATH

          # DEBUG: confirm the correct versions are used for the rest of the job
          echo "=== DEBUG: bison/flex after PATH force"
          which bison
          bison --version | head -n 1
          which flex
          flex --version | head -n 1

      - name: Install ncurses
        if: runner.os == 'macOS'
        run: |
          sudo mkdir -p /opt/nrnwheel/$(uname -m)
          sudo bash packaging/python/build_static_ncurses_osx.bash

      - name: Change name of package for release
        if: inputs.build_type == 'nightly'
        shell: bash
        run: |
          # Do not `source venv/bin/activate`: default Windows shell is pwsh,
          # and a Windows venv has Scripts/, not bin/. The runner is disposable.
          python3 -m pip install tomli tomli-w
          python3 packaging/python/change_name.py ./pyproject.toml neuron-nightly

      - name: Optimize RX3D Python module
        if: inputs.optimize_rxd == true
        run: |
          echo "NRN_RX3D_OPT_LEVEL=1" >> $GITHUB_ENV

      - name: Set custom version
        if: inputs.version != ''
        run: |
          echo SETUPTOOLS_SCM_PRETEND_VERSION=${{ inputs.version }} >> $GITHUB_ENV

      - name: Build wheel
        shell: bash
        run: |
          if [ "${RUNNER_OS}" = "Windows" ]; then
            plat=windows
          else
            plat="$(uname -s)"
          fi
          bash packaging/python/build_wheels.bash "${plat}" ${{ inputs.python_version }}

      - name: Upload wheel files
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ inputs.python_version }}-${{ inputs.platform }}
          path: wheelhouse/*.whl

      - name: Setup Python 3.11 for testing
        id: py311
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Python 3.12 for testing
        id: py312
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Python 3.13 for testing
        id: py313
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup Python 3.14 for testing
        id: py314
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y mpich openmpi-bin libopenmpi-dev libmpich-dev ninja-build
          # Ubuntu 24.04: pin working mpich from ci/deps (no Launchpad download).
          # See ci/deps/README.md and LP#2072338.
          bash ci/deps/install_mpich_noble.sh

      - name: Set env vars for testing (Linux)
        if: startsWith(inputs.platform, 'ubuntu')
        run: |
          echo CMAKE_BUILD_PARALLEL_LEVEL=4 >> $GITHUB_ENV
          echo CMAKE_GENERATOR=Ninja >> $GITHUB_ENV

      - name: Set env vars for testing (MacOS)
        if: startsWith(runner.os, 'macOS')
        run: |
          if [[ "${{runner.os}}" == "macOS-15-intel" ]]; then
            echo CMAKE_BUILD_PARALLEL_LEVEL=4 >> $GITHUB_ENV
          else
            echo CMAKE_BUILD_PARALLEL_LEVEL=3 >> $GITHUB_ENV
          fi
          echo CMAKE_GENERATOR=Ninja >> $GITHUB_ENV

      # test_wheels.sh is Unix (venv/bin, gcc, mpirun). 3.11 wheel is tested
      # only on 3.11. The 3.12 job is cp312-abi3 and is tested on 3.12-3.14.
      - name: Test wheel
        if: runner.os != 'Windows'
        run: |
          py="${{ inputs.python_version }}"
          py="${py// /}"
          if [[ "${py}" == "3.11" ]]; then
            versions="3.11"
          else
            versions="${{ inputs.test_python_versions }}"
          fi
          IFS=',' read -ra versions <<< "${versions}"
          wheel="$(ls -t wheelhouse/*.whl | head -n 1)"
          for ver in "${versions[@]}"; do
            ver="${ver// /}"
            bash packaging/python/test_wheels.sh "$(command -v python${ver})" "${wheel}"
          done

      # MSVC: pip install the win_amd64 wheel, import + neuron.test(), serial
      # nrniv.cmd (Test 2), nrnivmodl.cmd tmp_mod (Test 4, cacum.mod ->
      # nrnmech.dll), neurondemo.cmd demo(4)/run/quit (Test 10, demo/release
      # nrnmech.dll), modlunit.cmd tmp_mod/cacum.mod (Test 11, nrnunits.lib),
      # python MS-MPI, then nrniv.cmd hoc under mpiexec.
      # setup-python leaves `python` as 3.14. Use the step paths so the 3.11
      # job does not test the 3.11 wheel on 3.14, and the abi3 job tests
      # 3.12-3.14.
      - name: Test Windows wheel
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PY_311: ${{ steps.py311.outputs.python-path }}
          PY_312: ${{ steps.py312.outputs.python-path }}
          PY_313: ${{ steps.py313.outputs.python-path }}
          PY_314: ${{ steps.py314.outputs.python-path }}
        run: |
          $whl = Get-ChildItem wheelhouse/*cp3*.whl | Select-Object -First 1
          if (-not $whl) { throw "no wheel in wheelhouse" }
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          Remove-Item Env:NEURONHOME -ErrorAction SilentlyContinue
          $env:NEURON_MODULE_OPTIONS = "-nogui"
          $repo = Get-Location
          # venv: python.exe and *.cmd live in Scripts/. Hosted CPython:
          # python.exe is in the prefix, pip console scripts in Scripts/.
          function Get-NrnCmd([string]$name) {
            $pydir = Split-Path $py
            foreach ($c in @(
              (Join-Path $pydir "$name.cmd"),
              (Join-Path $pydir "Scripts\$name.cmd")
            )) {
              if (Test-Path $c) { return $c }
            }
            throw "$name.cmd not found next to $py or in Scripts"
          }
          $buildPy = "${{ inputs.python_version }}".Trim()
          if ($buildPy -eq '3.11') {
            $versions = @('3.11')
          } else {
            $versions = "${{ inputs.test_python_versions }}".Split(',') | ForEach-Object { $_.Trim() } | Where-Object { $_ }
          }
          $pyByVer = @{
            '3.11' = $env:PY_311
            '3.12' = $env:PY_312
            '3.13' = $env:PY_313
            '3.14' = $env:PY_314
          }
          foreach ($ver in $versions) {
            Set-Location $repo
            $py = $pyByVer[$ver]
            if (-not $py) { throw "no interpreter mapped for Python $ver" }
            if (-not (Test-Path -LiteralPath $py)) { throw "Python $ver not found at $py" }
            Write-Host "=== Windows wheel on Python $ver ($py) ==="
            if (Test-Path 'tmp_mod') { Remove-Item -Recurse -Force 'tmp_mod' }
            if (Test-Path 'AMD64') { Remove-Item -Recurse -Force 'AMD64' }
            if (Test-Path 'nrnmech.dll') { Remove-Item -Force 'nrnmech.dll' }
            & $py -m pip install --force-reinstall $whl.FullName
            if ($LASTEXITCODE -ne 0) { throw "pip install failed on Python $ver ($LASTEXITCODE)" }
            & $py -c "import os, sys; print('python', sys.executable); import neuron; print(neuron.__file__); print(neuron.h.nrnversion()); print(neuron.h.neuronhome())"
            if ($LASTEXITCODE -ne 0) { throw "import neuron failed on Python $ver ($LASTEXITCODE)" }
            & $py -c "import neuron; neuron.test()"
            if ($LASTEXITCODE -ne 0) { throw "neuron.test() failed on Python $ver ($LASTEXITCODE)" }
            $nrniv = Get-NrnCmd 'nrniv'
            # Unix Test 2 is nrniv -c 'print "hello"'. pwsh -> cmd %* drops the
            # inner quotes (print hello is an undefined variable). print 42 is
            # the same hoc print statement. mpiexec cannot CreateProcess
            # extensionless Scripts\nrniv; nrniv.cmd is the PATHEXT wrapper.
            Write-Host "serial nrniv.cmd Test 2: $nrniv -c print 42 / quit"
            & $nrniv -c 'print 42' -c 'quit()'
            if ($LASTEXITCODE -ne 0) { throw "serial nrniv.cmd Test 2 failed on Python $ver ($LASTEXITCODE)" }
            # Unix Test 4 is nrnivmodl tmp_mod / cacum.mod then ARCH/special.
            # Windows nrnivmodl is the CMake package (not bash nrnivmodl.in);
            # output is cwd/nrnmech.dll and NRNIVMODL_SPECIAL is OFF. cmake
            # finds VS without vcvars; cl.exe need not be on PATH.
            $nrnivmodl = Get-NrnCmd 'nrnivmodl'
            if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) { throw "cmake not on PATH for nrnivmodl" }
            $modsrc = Join-Path $repo 'share/examples/nrniv/nmodl/cacum.mod'
            if (-not (Test-Path $modsrc)) { throw "cacum.mod not found at $modsrc" }
            New-Item -ItemType Directory -Path 'tmp_mod' | Out-Null
            Copy-Item $modsrc (Join-Path 'tmp_mod' 'cacum.mod')
            Write-Host "nrnivmodl Test 4: $nrnivmodl tmp_mod"
            & $nrnivmodl tmp_mod
            if ($LASTEXITCODE -ne 0) { throw "nrnivmodl Test 4 failed on Python $ver ($LASTEXITCODE)" }
            if (-not (Test-Path 'nrnmech.dll')) { throw "nrnivmodl Test 4 did not produce nrnmech.dll" }
            Write-Host "nrnivmodl Test 4 produced nrnmech.dll; insert cacum"
            & $py -c "from neuron import h; s = h.Section(); s.insert('cacum')"
            if ($LASTEXITCODE -ne 0) { throw "insert cacum failed on Python $ver ($LASTEXITCODE)" }
            # Unix Test 10 is neurondemo -c 'demo(4)' -c 'run()' -c 'quit()'.
            # Extensionless Scripts\neurondemo is a Python wrapper, not a
            # Win32 image (Error 193). neurondemo.cmd ports bash neurondemo.in
            # (nrnivmodl of share/nrn/demo/release, then nrniv -dll). -nogui:
            # IV/win.ini is not this gate. cmake is already required for Test 4.
            $neurondemo = Get-NrnCmd 'neurondemo'
            Write-Host "neurondemo Test 10: $neurondemo -nogui -c demo(4) / run / quit"
            & $neurondemo -nogui -c 'demo(4)' -c 'run()' -c 'quit()'
            if ($LASTEXITCODE -ne 0) { throw "neurondemo Test 10 failed on Python $ver ($LASTEXITCODE)" }
            Set-Location $repo
            # Unix Test 11 is modlunit tmp_mod/cacum.mod (find nrnunits.lib).
            # Extensionless Scripts\modlunit is a Python wrapper, not a Win32
            # image (Error 193). modlunit.cmd is the PATHEXT wrapper.
            $modlunit = Get-NrnCmd 'modlunit'
            & $py -c "import os, neuron; p=os.path.join(str(neuron.h.neuronhome()), 'lib', 'nrnunits.lib'); print(p); assert os.path.isfile(p), p"
            if ($LASTEXITCODE -ne 0) { throw "nrnunits.lib not found for modlunit Test 11 on Python $ver" }
            $mod = Join-Path $repo 'tmp_mod/cacum.mod'
            if (-not (Test-Path $mod)) { throw "tmp_mod/cacum.mod missing for modlunit Test 11" }
            Write-Host "modlunit Test 11: $modlunit $mod"
            & $modlunit $mod
            if ($LASTEXITCODE -ne 0) { throw "modlunit Test 11 failed on Python $ver ($LASTEXITCODE)" }
            $mpiBin = if (Test-Path 'C:\msmpi\bin\mpiexec.exe') { 'C:\msmpi\bin' } else { 'C:\msmpi\Bin' }
            $mpiexec = Join-Path $mpiBin 'mpiexec.exe'
            if (-not (Test-Path $mpiexec)) { throw "MS-MPI mpiexec not found under C:\msmpi" }
            if ($env:Path -notlike "$mpiBin*") { $env:Path = "$mpiBin;" + $env:Path }
            $testpy = Join-Path $repo 'src/parallel/test0.py'
            $testhoc = Join-Path $repo 'src/parallel/test0.hoc'
            Write-Host "MS-MPI python gate: $mpiexec -n 2 $py $testpy"
            & $mpiexec -n 2 $py $testpy -mpi --expected-hosts 2
            if ($LASTEXITCODE -ne 0) { throw "MS-MPI python gate failed on Python $ver ($LASTEXITCODE)" }
            Write-Host "MS-MPI nrniv gate: $mpiexec -n 2 $nrniv $testhoc"
            & $mpiexec -n 2 $nrniv $testhoc -mpi --expected-hosts 2
            if ($LASTEXITCODE -ne 0) { throw "MS-MPI nrniv gate failed on Python $ver ($LASTEXITCODE)" }
          }

